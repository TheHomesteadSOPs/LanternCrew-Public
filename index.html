<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="A choose-your-own-adventure story for kids. Sail with the Lantern Crew and meet the friendly pirates of Gingersnap Island."><title>The Lantern Crew</title></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one story screen at a time. Art and words sit side by side on a landscape tablet and stack on a phone or portrait tablet.
   Palette: sea-foam page, deep-sea ink, lantern gold for actions, teal for supporting marks. */
:root {
  --bg: #E9F2F1;
  --panel: #FFFFFF;
  --ink: #12263A;
  --muted: #476073;
  --line: #BFD4D2;
  --gold: #F2A93B;
  --gold-ink: #35220A;
  --teal: #176E7D;
  --teal-soft: #D7ECEE;
  --shadow: 0 6px 22px rgba(18, 38, 58, 0.14);
  --font-head: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1927; --panel: #14283C; --ink: #EAF2F6; --muted: #9FB5C5; --line: #28435C;
    --gold: #F5B54E; --gold-ink: #2D1C05; --teal: #62C6D6; --teal-soft: #173A4B;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1927; --panel: #14283C; --ink: #EAF2F6; --muted: #9FB5C5; --line: #28435C;
  --gold: #F5B54E; --gold-ink: #2D1C05; --teal: #62C6D6; --teal-soft: #173A4B;
  --shadow: 0 6px 22px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.55; margin: 0; padding-inline: 16px; padding-block: 12px 40px; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.1; text-wrap: balance; margin: 0; }
img { display: block; max-width: 100%; }
.app { max-width: 1240px; margin-inline: auto; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-block: 4px 12px; }
.bar[hidden] { display: none; }
.bar-group { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 48px; min-width: 48px; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; }
.chip:hover { border-color: var(--teal); }
.chip:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

/* cover */
.cover { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 8px; }
.cover-art img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 22px; box-shadow: var(--shadow); }
.eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.8rem; font-weight: 700; color: var(--teal); margin: 0 0 10px; }
.cover h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 800; }
.cover h1 span { display: block; font-size: 0.45em; font-weight: 600; margin-top: 10px; color: var(--muted); }
.byline { margin: 14px 0 22px; color: var(--muted); }
.actions { display: grid; gap: 12px; max-width: 460px; }
.btn { min-height: 60px; padding: 12px 22px; border-radius: 16px; border: 2px solid var(--teal); background: var(--panel); font-weight: 700; font-size: 1.1rem; cursor: pointer; text-align: left; }
.btn:hover { background: var(--teal-soft); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-size: 1.3rem; text-align: center; }
.btn.primary:hover { filter: brightness(1.06); }
.found { margin: 22px 0 0; color: var(--muted); }
.pips { display: flex; gap: 8px; margin-top: 8px; }
.pip { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--teal); }
.pip.on { background: var(--gold); border-color: var(--gold); }

/* story page */
.page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; animation: fade 0.25s ease both; }
.art img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 22px; box-shadow: var(--shadow); max-height: calc(100vh - 110px); }
.art { position: sticky; top: 8px; }
.copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.story p { margin: 0 0 0.9em; font-size: var(--fs, 1.4rem); line-height: 1.5; max-width: 42em; }
.story p.prompt { font-family: var(--font-head); font-weight: 800; color: var(--teal); font-size: calc(var(--fs, 1.4rem) * 1.1); margin-top: 0.4em; }
.choices { display: grid; gap: 12px; }
.choice { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 68px; padding: 14px 20px; border-radius: 18px; border: 2px solid var(--teal); background: var(--panel); font-weight: 700; font-size: 1.2rem; text-align: left; cursor: pointer; box-shadow: var(--shadow); }
.choice:hover, .choice:focus-visible { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.choice .go { font-family: var(--font-head); font-size: 1.5rem; }

/* ending */
.end { display: grid; gap: 14px; padding: 20px; border-radius: 22px; background: var(--teal-soft); border: 2px solid var(--teal); }
.end h2 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; }
.end .name { font-weight: 700; color: var(--teal); letter-spacing: 0.04em; }
.end-actions { display: grid; gap: 10px; }
.endings { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 6px 14px; border-radius: 999px; border: 2px solid var(--teal); font-size: 0.95rem; font-weight: 700; }
.tag.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.tag.off { color: var(--muted); border-style: dashed; }

/* crew, how to, recipe */
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 22px; }
.stack { display: grid; gap: 22px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
.crew-img { width: 100%; border-radius: 18px; box-shadow: var(--shadow); }
.cast { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.cast b { font-family: var(--font-head); font-size: 1.15rem; }
.howto ol { margin: 12px 0 0; padding-left: 1.3em; display: grid; gap: 8px; font-size: 1.15rem; }
.recipe h2 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); font-weight: 800; }
.meta { color: var(--muted); margin: 6px 0 0; }
.ingredients { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.ingredients label { display: flex; gap: 12px; align-items: center; min-height: 44px; font-size: 1.1rem; cursor: pointer; }
.ingredients input { width: 24px; height: 24px; accent-color: var(--teal); flex: none; }
.ingredients input:checked + span { text-decoration: line-through; color: var(--muted); }
.steps { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 1.15rem; }
.steps li::before { counter-increment: step; content: counter(step); width: 44px; height: 44px; border-radius: 50%; background: var(--teal); color: var(--panel); display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; }
.who { display: inline-block; margin-right: 8px; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.who.adult { background: var(--gold); color: var(--gold-ink); }
.who.kid { background: var(--teal-soft); color: var(--teal); border: 2px solid var(--teal); }
.note { color: var(--muted); font-size: 1rem; margin-top: 14px; }

@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } }
@media (max-width: 860px) {
  .cover, .page, .two { grid-template-columns: minmax(0, 1fr); }
  .art { position: static; }
  .art img { aspect-ratio: 4 / 3; max-height: none; }
  .cover-art img { aspect-ratio: 4 / 3; }
  body { font-size: 17px; }
}
</style>

<div class="app" id="app">
  <header class="bar" id="bar" hidden>
    <div class="bar-group">
      <button class="chip" data-act="home" id="b-home">Home</button>
      <button class="chip" data-act="back" id="b-back">&larr; Back</button>
      <button class="chip" data-act="restart" id="b-restart">Start over</button>
    </div>
    <div class="bar-group" role="group" aria-label="Text size">
      <button class="chip" data-act="smaller" id="b-small" aria-label="Smaller text">A&minus;</button>
      <button class="chip" data-act="bigger" id="b-big" aria-label="Bigger text">A+</button>
    </div>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
const STORY = {"1": {"paras": ["On a bright, breezy morning, Captain Juniper the fox was sweeping the beach when something glinted in the sand.", "It was a bottle! Inside was a torn, salty map. It showed an island shaped exactly like a gingersnap cookie, with a big red X.", "\"Adventure!\" cried Juniper. \"Lantern Crew, gather round!\"", "Barnaby the walrus came waddling with a basket of snacks. Pip the parrot zoomed in happy circles. Dot the octopus pulled a magnifying glass from one of her eight pockets.", "\"Look,\" whispered Pip. \"There's a skull-and-crossbones flag in the corner. Pirates!\"", "What should the Lantern Crew do?"], "prompt": true, "choices": [{"label": "Let Dot study the map first", "to": 2}, {"label": "Set sail right away!", "to": 3}], "ending": null, "banner": null, "recipe": false, "art": "s01", "alt": "All four crew members on a sunny beach around an open bottle and a torn map showing a cookie-shaped island with a red X; a tiny skull flag in the corner"}, "2": {"paras": ["Dot held her magnifying glass over the map.", "\"There's tiny writing,\" she said. \"It says: Follow the smell of ginger. Trust the lantern.\"", "Barnaby sniffed the map. \"It does smell a little like cookies,\" he said hopefully.", "Then Dot noticed something else, a faint fold line across the corner. \"Maybe,\" she said slowly, \"this map folds a second way.\"", "What should the crew do?"], "prompt": true, "choices": [{"label": "Sail the way the map is drawn", "to": 3}, {"label": "Fold the map the other way", "to": 36}], "ending": null, "banner": null, "recipe": false, "art": "s02", "alt": "Dot peering through her magnifying glass at the map, one tentacle pointing at a faint fold line; Barnaby sniffing the corner"}, "3": {"paras": ["The Lantern Crew climbed aboard their little ship, the Lantern, and hoisted the sails.", "There were three ways to Gingersnap Island.", "The shortest went through the Stormy Strait, where the waves jumped like frogs.", "Another went through the Foggy Reef, so thick with mist you couldn't see your own nose.", "The last went through Whale Channel, where a giant whale was said to be napping.", "Which way should they go?"], "prompt": true, "choices": [{"label": "The Stormy Strait", "to": 4}, {"label": "The Foggy Reef", "to": 5}, {"label": "Whale Channel", "to": 6}], "ending": null, "banner": null, "recipe": false, "art": "s03", "alt": "The little ship Lantern at sea with three paths fanning out: a stormy dark sky, a wall of fog, and a huge sleeping whale shape"}, "4": {"paras": ["Thunder rumbled. Waves slapped the ship left and right.", "\"Somebody has to steer!\" shouted Juniper.", "Pip puffed out his tiny chest. \"I'll do it!\"", "Who should take the wheel?"], "prompt": true, "choices": [{"label": "Captain Juniper takes the wheel", "to": 10}, {"label": "Pip takes the wheel", "to": 7}], "ending": null, "banner": null, "recipe": false, "art": "s04", "alt": "A storm-tossed Lantern, big waves, Juniper gripping the wheel while Pip hovers eagerly beside her"}, "5": {"paras": ["The fog crept in thick as porridge. Soon the crew couldn't see the front of the ship, or the back, or each other.", "\"Which way is the island?\" whispered Barnaby.", "\"I'll find out,\" said Juniper, \"with the lantern!\" But Pip was already fluttering off the deck.", "What should the crew do?"], "prompt": true, "choices": [{"label": "Juniper lifts the lantern high and sails toward its glow", "to": 11}, {"label": "Let Pip fly ahead to scout", "to": 8}], "ending": null, "banner": null, "recipe": false, "art": "s05", "alt": "The Lantern drifting through thick white fog; Juniper holding up the glowing lantern while Pip's tail feathers vanish into the mist"}, "6": {"paras": ["\"Shhh,\" whispered Barnaby. \"The whale is sleeping.\"", "A giant whale as big as a hill lay right across Whale Channel, snoring in slow, wobbly bubbles. There was no room to sail around.", "What should the crew try?"], "prompt": true, "choices": [{"label": "Barnaby hums a lullaby and offers a snack", "to": 12}, {"label": "Dot tickles the whale's nose with her Super Feather Duster 3000", "to": 9}], "ending": null, "banner": null, "recipe": false, "art": "s06", "alt": "A gigantic sleeping whale blocking a narrow channel, tiny ship in front of it, Barnaby with a snack basket and Dot with a feather duster gadget"}, "7": {"paras": ["Pip flapped onto the wheel and spun it with all his tiny might.", "WHOOSH! A big gust of wind lifted him off the wheel, turned him upside down, and dropped him into a bucket.", "\"I meant to do that,\" he squeaked.", "Juniper grabbed the wheel and steered the Lantern safely through the waves. Soon the clouds began to crack open."], "prompt": false, "choices": [{"label": "Sail on!", "to": 10}], "ending": null, "banner": null, "recipe": false, "art": "s07", "alt": "Pip upside down in a bucket, legs sticking out, while Juniper steers calmly in the background"}, "8": {"paras": ["Pip zoomed into the fog. \"Follow me!\" he chirped.", "But soon his chirps came from the left... then the right... then somewhere high above. The fog was playing tricks on everyone's ears.", "Dot dug in a pocket and pulled out a little brass bell. \"I can ring this to call him back,\" she said.", "But Barnaby shook his head. \"Or we could just follow the chirping. It's got to lead somewhere.\"", "What should the crew do?"], "prompt": true, "choices": [{"label": "Dot rings the bell to call Pip back", "to": 11}, {"label": "Follow the chirping, wherever it goes", "to": 37}], "ending": null, "banner": null, "recipe": false, "art": "s08", "alt": "Fog everywhere; Dot holding up a little brass bell; Barnaby pointing into the mist toward faint chirping music notes"}, "9": {"paras": ["Dot unfolded her Super Feather Duster 3000 and gave the whale's nose the tiniest tickle.", "The whale's nose twitched... and twitched... and twitched...", "AH-AH-AH-CHOOOO!", "A fountain of seawater showered the whole crew, and the Lantern surfed right over the whale's back and out the other side.", "\"Pardon me,\" murmured the whale, and went back to sleep."], "prompt": false, "choices": [{"label": "Sail on!", "to": 12}], "ending": null, "banner": null, "recipe": false, "art": "s09", "alt": "The whale mid-sneeze, spray fountain, the small ship riding the splash like a surfboard, crew soaked and laughing"}, "10": {"paras": ["The storm rumbled away, and out of the clouds loomed a huge ship with black sails and a flag with a smiling skull and crossbones.", "BOOM! A cannon roared.", "\"Pirates!\" squeaked Pip, diving under a barrel.", "But instead of a cannonball, out of the cannon came... confetti. Pink, yellow, and blue confetti rained over the Lantern.", "\"Welcome!\" boomed a voice. \"WELCOME, FRIENDS!\""], "prompt": false, "choices": [{"label": "Keep going", "to": 13}], "ending": null, "banner": null, "recipe": false, "art": "s10", "alt": "A big black-sailed ship, the Jolly Biscuit, firing a cannon that sprays colorful confetti over the little Lantern; Pip hiding under a barrel"}, "11": {"paras": ["The fog thinned like a curtain being pulled aside.", "There, right in front of them, floated a big ship with patched sails painted with cookies. A banner across the front read JOLLY BISCUIT. A smiling skull-and-crossbones flapped on top.", "\"Is that... a pirate ship?\" asked Dot.", "A round seal waved a spoon from the deck. \"Ahoy there! Mind the biscuits!\""], "prompt": false, "choices": [{"label": "Keep going", "to": 13}], "ending": null, "banner": null, "recipe": false, "art": "s11", "alt": "Fog lifting to reveal the pirate ship Jolly Biscuit with cookie-painted sails; a round seal waving a wooden spoon"}, "12": {"paras": ["Past the whale, the sea turned bright and calm.", "Gingersnap Island rose in front of them: round and golden-brown, with cracks like a freshly baked cookie. Beside it was docked a ship with patched sails and a skull-and-crossbones flag.", "Little pirates were already waving, some from the deck and one, a crab, from the top of a mast.", "\"Visitors!\" somebody shouted. \"Put the kettle on!\""], "prompt": false, "choices": [{"label": "Keep going", "to": 13}], "ending": null, "banner": null, "recipe": false, "art": "s12", "alt": "The golden cookie-shaped island, the pirate ship docked beside it, pirates waving from the deck and a crab on the mast"}, "13": {"paras": ["The pirate ship bobbed beside the Lantern.", "On the deck stood a huge sea otter in a hat as big as a bathtub, a round seal juggling three biscuits, and a crab with a little eyepatch.", "They did not look fierce. They looked... a little bit like they were waiting for someone to say hello.", "What should the Lantern Crew do?"], "prompt": true, "choices": [{"label": "Hide behind the barrels and watch", "to": 14}, {"label": "Sail up and shout \"Ahoy!\"", "to": 15}], "ending": null, "banner": null, "recipe": false, "art": "s13", "alt": "The three pirates on deck: Captain Marigold Barnacle (otter, huge hat), Cannonball (round seal juggling biscuits), Crabby Pete (crab with eyepatch); the Lantern crew looking up"}, "14": {"paras": ["The crew ducked behind the barrels and peeked out.", "The pirates were singing a silly song about lost socks. Cannonball the seal tried to juggle his biscuits and dropped every one. Crabby Pete grumbled, \"I told you not to juggle.\"", "Then Pip sneezed. \"ACHOO!\"", "Every pirate turned. \"Well, shiver me biscuits!\" laughed the big otter. \"We have guests!\""], "prompt": false, "choices": [{"label": "Keep going", "to": 16}], "ending": null, "banner": null, "recipe": false, "art": "s14", "alt": "The crew peeking over barrels while pirates sing; Cannonball dropping biscuits; Pip mid-sneeze, feathers puffed"}, "15": {"paras": ["\"AHOY!\" shouted Juniper in her biggest captain voice.", "\"AHOY YOURSELF!\" boomed the huge otter, tossing her hat in the air. \"Welcome aboard, friends!\"", "The pirates laughed and cheered. Cannonball threw a biscuit to Barnaby, who caught it in his mouth. It was the best welcome any of them had ever had."], "prompt": false, "choices": [{"label": "Keep going", "to": 16}], "ending": null, "banner": null, "recipe": false, "art": "s15", "alt": "Juniper standing tall on the Lantern's bow shouting; Captain Marigold tossing her hat; Barnaby catching a biscuit in his mouth"}, "16": {"paras": ["\"I'm Captain Marigold Barnacle,\" said the otter, \"and this is my crew: the Friendly Pirates of Gingersnap Island.\"", "\"Pirates?\" said Pip. \"Aren't you supposed to be scary?\"", "\"We tried,\" said Cannonball. \"We're better at baking.\"", "Then the captain's face went serious. \"Our greatest treasure is the Golden Gingersnap Recipe, locked away in the Cookie Cave. But the paths to the cave are so tricky that we got stuck. Twice.\"", "\"Three times,\" grumbled Crabby Pete.", "Juniper raised her lantern. \"The Lantern Crew will help you!\""], "prompt": false, "choices": [{"label": "Head for the island", "to": 17}], "ending": null, "banner": null, "recipe": false, "art": "s16", "alt": "Captain Marigold, Cannonball and Crabby Pete explaining to the Lantern crew on the pirate deck; Pete holding up three claw-pinchers"}, "17": {"paras": ["The pirates pointed to three trails that wound up toward the Cookie Cave.", "One climbed the Crumbly Cliffs, made of stone that fell apart at the slightest touch.", "One twisted through the Whispering Jungle, where parrots repeated everything they heard.", "One wound through the Tidepool Maze, full of slippery rocks and splashy puddles.", "Which trail should the Lantern Crew take?"], "prompt": true, "choices": [{"label": "The Crumbly Cliffs", "to": 18}, {"label": "The Whispering Jungle", "to": 21}, {"label": "The Tidepool Maze", "to": 24}], "ending": null, "banner": null, "recipe": false, "art": "s17", "alt": "Map-style view of Gingersnap Island showing three trails: a crumbly cliff, a leafy jungle full of parrots, and a maze of tide pools, all leading toward a cave"}, "18": {"paras": ["The Crumbly Cliffs looked like a giant gingerbread wall. Every step sent little pebbles tumbling down.", "\"We need a way up,\" said Juniper.", "Dot patted one of her pockets. Pip fluttered his wings eagerly.", "Who should lead the climb?"], "prompt": true, "choices": [{"label": "Dot, with her rope-launcher", "to": 19}, {"label": "Pip, who can fly the rope to the top", "to": 20}], "ending": null, "banner": null, "recipe": false, "art": "s18", "alt": "A tall crumbly golden-brown cliff with pebbles falling; Dot patting a pocket and Pip hovering by the crew at its base"}, "19": {"paras": ["Dot reached into pocket number three and pulled out a rope-launcher.", "FWOOMP! A hook sailed up the cliff and caught on a rock. One by one the Lantern Crew and the Friendly Pirates climbed, with Cannonball puffing, \"I regret every cookie I've ever eaten.\"", "At the top they could see the Cookie Cave, shining in the sunlight."], "prompt": false, "choices": [{"label": "On to the cave!", "to": 27}], "ending": null, "banner": null, "recipe": false, "art": "s19", "alt": "Dot firing a rope-launcher up the cliff; the crew and pirates climbing the rope in a line, Cannonball puffing at the back"}, "20": {"paras": ["Pip grabbed the rope in his beak and flew up, up, up. But the rope tangled around a loose rock. The whole cliff shook.", "CRUMBLE! CRUMBLE! CRUMBLE!", "The crew slid down in a soft heap of gingery sand. \"Told you so,\" muttered Crabby Pete.", "But the falling rocks had opened a hidden tunnel in the cliff. It led straight toward the Cookie Cave!"], "prompt": false, "choices": [{"label": "Through the tunnel!", "to": 27}], "ending": null, "banner": null, "recipe": false, "art": "s20", "alt": "The crew in a heap at the cliff base in golden sand; a newly opened dark tunnel behind them; Crabby Pete smugly pointing"}, "21": {"paras": ["The Whispering Jungle was full of parrots who repeated everything.", "\"Left?\" said Pip. \"Left? Left?\" said the parrots.", "\"If you talk too loud,\" whispered Captain Marigold, \"they get confused and lead you in circles.\"", "Who should talk to the parrots?"], "prompt": true, "choices": [{"label": "Barnaby, who speaks softly", "to": 22}, {"label": "Pip, who speaks fluent parrot, very loudly", "to": 23}], "ending": null, "banner": null, "recipe": false, "art": "s21", "alt": "A leafy jungle with dozens of colorful parrots on branches; Barnaby and Pip each with a thought bubble of a different voice (quiet vs. loud)"}, "22": {"paras": ["Barnaby took a deep breath and spoke in his softest voice. \"Please... could you show us the way?\"", "\"Way,\" whispered the parrots. \"Way... way...\" One by one they spread their wings and pointed along a hidden path through the leaves.", "\"Thank you,\" whispered Barnaby, and he gave each parrot a tiny cracker.", "The path led straight to the Cookie Cave."], "prompt": false, "choices": [{"label": "On to the cave!", "to": 27}], "ending": null, "banner": null, "recipe": false, "art": "s22", "alt": "Barnaby crouched gently whispering to a flock of parrots, who all point their wings down a hidden path; he is handing out tiny crackers"}, "23": {"paras": ["Pip squawked, \"WHICH WAY TO THE COOKIE CAVE?\"", "\"CAVE! CAVE! LEFT! RIGHT! STRAIGHT! BACKWARDS!\" screamed the parrots.", "The Lantern Crew followed every direction at once. They went left, then right, then in a circle, and finally tumbled out of the jungle onto a huge, round hill with cracks all over it.", "\"It's a giant cookie!\" cried Dot.", "It wasn't the treasure, but the Friendly Pirates came running and everyone agreed it was the best picnic spot in the world. They spent the afternoon rolling down the cookie hill, laughing until their sides hurt.", "Maybe the treasure can wait until another day."], "prompt": false, "choices": [], "ending": "The Giant Cookie Hill", "banner": "THE END", "recipe": false, "art": "s23", "alt": "A giant round golden cookie-shaped hill with cracks; the crew and pirates rolling and laughing down it; Pip dizzy at the bottom"}, "24": {"paras": ["The Tidepool Maze twisted like a bowl of spaghetti. There were crabs, starfish, and tricky puddles everywhere.", "\"We need a way through,\" said Juniper.", "Dot pulled out a periscope. Juniper bounced on her toes. She was ready to leap right in.", "Who should lead?"], "prompt": true, "choices": [{"label": "Dot, with her periscope", "to": 25}, {"label": "Juniper, who leaps right in", "to": 26}], "ending": null, "banner": null, "recipe": false, "art": "s24", "alt": "A winding maze of tide pools and slippery rocks with starfish and crabs; Dot holding a periscope; Juniper crouched ready to leap"}, "25": {"paras": ["Dot popped up her little periscope and spun it around. \"I can see the whole maze from here!\" she said.", "She found a path of flat stepping stones that wound through the pools. The crew tiptoed along it, one by one, keeping dry.", "At the end of the stones waited the mouth of the Cookie Cave."], "prompt": false, "choices": [{"label": "On to the cave!", "to": 27}], "ending": null, "banner": null, "recipe": false, "art": "s25", "alt": "Dot raising a periscope above the pools; the crew hopping along a trail of stepping stones in a neat line"}, "26": {"paras": ["Juniper took a running leap. SPLASH!", "She landed face-first in a rock pool with a starfish on her head. \"I'm fine!\" she called, her voice bubbly.", "But her splash hit a hidden lever. Gurgle, gurgle, gurgle, the water drained away, and a staircase carved in the rock was revealed.", "\"That,\" said Juniper, dripping, \"was totally the plan.\"", "The stairs led straight to the Cookie Cave."], "prompt": false, "choices": [{"label": "On to the cave!", "to": 27}], "ending": null, "banner": null, "recipe": false, "art": "s26", "alt": "Juniper sitting in a rock pool with a starfish on her head and a grin; behind her, the water draining to reveal stone steps"}, "27": {"paras": ["At last the Lantern Crew and the Friendly Pirates stood before the Cookie Cave.", "A giant r ll, "recipe": false, "art": "s30", "alt": "Juniper holding her lantern up to a lantern-shaped dent in the door; the door glowing warm gold and swinging open"}, "31": {"paras": ["Inside the cave, on a stone table, stood a dusty chest with a golden gingersnap carved on the lid.", "Juniper lifted the lid. There were no coins, no jewels. Just one old, buttery card that said:", "THE GOLDEN GINGERSNAP RECIPE.", "\"The treasure!\" gasped Captain Marigold, wiping her eyes. \"You found it!\"", "What should the Lantern Crew do?"], "prompt": true, "choices": [{"label": "Bake the cookies together, right now", "to": 32}, {"label": "Give the recipe to Captain Marigold", "to": 33}, {"label": "Keep the recipe for the Lantern Crew", "to": 34}, {"label": "Turn the card over and read the back", "to": 35}], "ending": null, "banner": null, "recipe": false, "art": "s31", "alt": "Inside the glowing cave: a stone table with an open chest and a single recipe card; Captain Marigold tearing up with joy; all the friends gathered round"}, "32": {"paras": ["Everyone squeezed into the pirate ship's cozy kitchen.", "Barnaby measured. Dot stirred with a gadget that stirred faster than any spoon. Cannonball rolled the dough into balls, only dropping three. Pip sprinkled the sugar, and also a little of himself. Crabby Pete grumbled that it was too much sugar, then ate four cookies.", "The kitchen filled with the warm smell of ginger and cinnamon.", "When the first batch came out, golden and crackly on top, the whole crew agreed: it was the best treasure in the world."], "prompt": false, "choices": [], "ending": "The Big Bake", "banner": "THE END", "recipe": true, "art": "s32", "alt": "A warm ship's kitchen with the whole crew baking: Barnaby measuring, Dot's gadget stirring, Cannonball rolling dough, Pip sprinkling sugar, trays of golden cookies"}, "33": {"paras": ["Juniper held out the recipe, and Captain Marigold took it with both paws.", "\"For a hundred years the Friendly Pirates have been missin ner": "THE END", "recipe": false, "art": "s37", "alt": "The Lantern stuck on a sandbar in fog; the glowing Jolly Biscuit emerging with Cannonball waving; crew sipping cocoa on a pirate deck"}};
const IMG = {"s01": "images/s01.jpg", "s02": "images/s02.jpg", "s03": "images/s03.jpg", "s04": "images/s04.jpg", "s05": "images/s05.jpg", "s06": "images/s06.jpg", "s07": "images/s07.jpg", "s08": "images/s08.jpg", "s09": "images/s09.jpg", "s10": "images/s10.jpg", "s11": "images/s11.jpg", "s12": "images/s12.jpg", "s13": "images/s13.jpg", "s14": "images/s14.jpg", "s15": "images/s15.jpg", "s16": "images/s16.jpg", "s17": "images/s17.jpg", "s18": "images/s18.jpg", "s19": "images/s19.jpg", "s20": "images/s20.jpg", "s21": "images/s21.jpg", "s22": "images/s22.jpg", "s23": "images/s23.jpg", "s24": "images/s24.jpg", "s25": "images/s25.jpg", "s26": "images/s26.jpg", "s27": "images/s27.jpg", "s28": "images/s28.jpg", "s29": "images/s29.jpg", "s30": "images/s30.jpg", "s31": "images/s31.jpg", "s32": "images/s32.jpg", "s33": "images/s33.jpg", "s34": "images/s34.jpg", "s35": "images/s35.jpg", "s36": "images/s36.jpg", "s37": "images/s37.jpg", "cover": "images/cover.jpg", "recipe": "images/recipe.jpg", "crew": "images/crew.jpg", "pirates": "images/pirates.jpg"};
const ENDINGS = ["The Giant Cookie Hill", "The Big Bake", "Honorary Pirates", "Finders Keepers (Almost)", "The Second Map", "The Secret Lagoon", "Rescued in the Fog"];
const CREW = [
  ["Captain Juniper", "A bold young fox with a big blue hat and a glowing lantern. She leads the crew."],
  ["Barnaby", "A gentle walrus who cooks the snacks. He is careful, and he is always hungry."],
  ["Pip", "A tiny parrot with goggles and a red scarf. He scouts ahead and sometimes gets lost."],
  ["Dot", "An octopus inventor with eight pockets full of gadgets. She is quiet and very clever."]
];
const PIRATES = [
  ["Captain Marigold Barnacle", "A big sea otter with a huge hat and a booming laugh. She is not scary at all."],
  ["Cannonball", "A round, giggly seal who juggles biscuits and trips over ropes."],
  ["Crabby Pete", "A grumbly crab with an eyepatch. He complains a lot, but he always helps."]
];
const SIZES = [1.15, 1.3, 1.45, 1.65, 1.9];
let sizeIx = 2, stack = [], cur = null, view = "cover", found = new Set();

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
try { found = new Set(JSON.parse(safeGet("lc-endings") || "[]")); } catch (e) { found = new Set(); }
const s0 = parseInt(safeGet("lc-size"), 10); if (s0 >= 0 && s0 < SIZES.length) sizeIx = s0;

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stage = $("#stage"), bar = $("#bar");

function applySize() {
  document.documentElement.style.setProperty("--fs", SIZES[sizeIx] + "rem");
  $("#b-small").disabled = sizeIx === 0; $("#b-big").disabled = sizeIx === SIZES.length - 1;
}
function put(html, showBar, name) { view = name; stage.innerHTML = html; bar.hidden = !showBar; window.scrollTo(0, 0); }
function pips() { return ENDINGS.map((e) => `<span class="pip ${found.has(e) ? "on" : ""}"></span>`).join(""); }

function cover() {
  cur = null; stack = [];
  put(`<section class="cover">
    <div class="cover-art"><img src="${IMG.cover}" alt="The Lantern crew sails toward a cookie-shaped island beside a friendly pirate ship"></div>
    <div>
      <p class="eyebrow">A choose-your-own-adventure</p>
      <h1>The Lantern Crew <span>and the Friendly Pirates of Gingersnap Island</span></h1>
      <p class="byline">by Sam Gallant</p>
      <div class="actions">
        <button class="btn primary" data-act="start">Start the adventure</button>
        <button class="btn" data-act="howto">How to play</button>
        <button class="btn" data-act="crew">Meet the crew</button>
        <button class="btn" data-act="recipe">Barnaby's gingersnap recipe</button>
      </div>
      <p class="found"><b>Endings found: ${found.size} of ${ENDINGS.length}</b></p>
      <div class="pips" aria-hidden="true">${pips()}</div>
    </div></section>`, false, "cover");
}

function howto() {
  put(`<section class="stack"><div class="panel howto"><h2>How to play</h2>
    <ol>
      <li>Read the page out loud. Then look at the choices at the bottom.</li>
      <li>Pick one by tapping it. The story jumps to the page that choice leads to.</li>
      <li>When you reach THE END, tap Play again and make different choices.</li>
      <li>There are ${ENDINGS.length} endings, and one of them is a secret. Can you find them all?</li>
      <li>Made a choice you don't like? Tap Back to undo it.</li>
    </ol></div>
    <button class="btn primary" data-act="start">Start the adventure</button></section>`, true, "howto");
}

function people(title, img, list) {
  return `<div class="panel"><h2>${title}</h2><img class="crew-img" src="${img}" alt="${title}" style="margin-top:14px">
    <ul class="cast">${list.map((p) => `<li><b>${esc(p[0])}</b><br>${esc(p[1])}</li>`).join("")}</ul></div>`;
}
function crew() {
  put(`<section class="stack"><div class="two">${people("The Lantern Crew", IMG.crew, CREW)}${people("The Friendly Pirates", IMG.pirates, PIRATES)}</div>
    <button class="btn primary" data-act="start">Start the adventure</button></section>`, true, "crew");
}

const RECIPE = {
  ingredients: ["2 1/2 cups (300 g) all-purpose flour", "2 teaspoons baking soda", "2 teaspoons ground ginger", "1 teaspoon ground cinnamon", "1/2 teaspoon ground cloves", "3/4 teaspoon salt", "3/4 cup (170 g) soft butter", "3/4 cup (165 g) packed brown sugar", "1/4 cup (90 g) molasses", "1 egg", "2 teaspoons vanilla", "1/4 cup (50 g) white sugar, for rolling"],
  steps: [
    ["adult", "Turn the oven on to 350 degrees F (175 C). Cover two baking trays with baking paper."],
    ["kid", "Put the flour, baking soda, ginger, cinnamon, cloves and salt in a bowl. Stir them together. This is your spice bowl."],
    ["kid", "In a big bowl, mix the soft butter and brown sugar until it looks light and fluffy, like a cloud."],
    ["kid", "Add the molasses, egg and vanilla. Stir until smooth."],
    ["kid", "Pour the spice bowl into the big bowl a little at a time. Stir until no flour is left, but don't over-stir."],
    ["adult", "Put the dough in the fridge for 30 minutes. This keeps the cookies thick and chewy. Pirates say it's the secret."],
    ["kid", "Roll the dough into balls about the size of a big marble (1 tablespoon each). Roll each ball in the white sugar."],
    ["kid", "Put the balls on the trays, a few fingers apart."],
    ["adult", "Bake for 10 to 12 minutes. The edges should be set and the middles should look a little soft and cracked on top."],
    ["kid", "Let the cookies cool on the tray for 5 minutes. They finish baking and firm up as they cool."],
    ["kid", "Share them with your friends. Pirates always share."]
  ]
};
function recipe() {
  put(`<section class="stack recipe"><div class="two">
    <div class="panel"><img class="crew-img" src="${IMG.recipe}" alt="Barnaby the walrus baking gingersnap cookies in the ship's kitchen"></div>
    <div class="panel"><p class="eyebrow">A recipe to make together</p><h2>Barnaby's Golden Gingersnaps</h2>
      <p class="meta">Makes about 30 cookies. Prep 20 minutes, chill 30 minutes, bake 10 to 12 minutes.</p>
      <h3 style="margin-top:20px">What you need</h3>
      <ul class="ingredients">${RECIPE.ingredients.map((x, i) => `<li><label><input type="checkbox" id="ing${i}"><span>${esc(x)}</span></label></li>`).join("")}</ul></div></div>
    <div class="panel"><h3>What to do</h3><ol class="steps">${RECIPE.steps.map((s) => `<li><span><span class="who ${s[0]}">${s[0] === "adult" ? "Grown-up job" : "Kid job"}</span>${esc(s[1])}</span></li>`).join("")}</ol>
      <p class="note">Please don't eat the raw dough. It has a raw egg in it. These cookies contain wheat, milk and egg. A grown-up should handle the oven and the hot trays.</p></div>
    <button class="btn primary" data-act="start">Start the adventure</button></section>`, true, "recipe");
}

function go(id) { if (cur !== null) stack.push(cur); cur = id; story(id); }
function back() {
  if (view !== "story") { if (cur !== null) story(cur); else cover(); return; }
  if (stack.length) { cur = stack.pop(); story(cur); } else cover();
}

function story(id) {
  const n = STORY[id];
  const text = n.paras.map((p, i) => `<p${n.prompt && i === n.paras.length - 1 ? ' class="prompt"' : ""}>${esc(p)}</p>`).join("");
  let tail = "";
  if (n.ending) {
    found.add(n.ending); safeSet("lc-endings", JSON.stringify([...found]));
    tail = `<div class="end"><h2>${esc(n.banner)}</h2><p class="name">Ending: ${esc(n.ending)}</p>
      <div><b>Endings found: ${found.size} of ${ENDINGS.length}</b>
        <div class="endings" style="margin-top:8px">${ENDINGS.map((e) => found.has(e) ? `<span class="tag on">${esc(e)}</span>` : `<span class="tag off">? ? ?</span>`).join("")}</div></div>
      <div class="end-actions">
        <button class="btn primary" data-act="restart">Play again</button>
        <button class="btn" data-act="back">Go back one step and choose differently</button>
        ${n.recipe ? `<button class="btn" data-act="recipe">Bake the cookies: open Barnaby's recipe</button>` : ""}
      </div></div>`;
  } else {
    tail = `<nav class="choices" aria-label="Choices">${n.choices.map((c) => `<button class="choice" data-to="${c.to}"><span>${esc(c.label)}</span><span class="go" aria-hidden="true">&rarr;</span></button>`).join("")}</nav>`;
  }
  put(`<section class="page"><figure class="art" style="margin:0"><img src="${IMG[n.art]}" alt="${esc(n.alt)}"></figure>
    <div class="copy"><div class="story">${text}</div>${tail}</div></section>`, true, "story");
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-to]"); if (!t) return;
  if (t.dataset.to) { go(parseInt(t.dataset.to, 10)); return; }
  const a = t.dataset.act;
  if (a === "start" || a === "restart") { stack = []; cur = null; go(1); }
  else if (a === "back") back();
  else if (a === "home") cover();
  else if (a === "howto") howto();
  else if (a === "crew") crew();
  else if (a === "recipe") recipe();
  else if (a === "smaller" && sizeIx > 0) { sizeIx--; safeSet("lc-size", sizeIx); applySize(); }
  else if (a === "bigger" && sizeIx < SIZES.length - 1) { sizeIx++; safeSet("lc-size", sizeIx); applySize(); }
});

applySize(); cover();
</script>
